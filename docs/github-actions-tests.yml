name: tests

on:
  push:
    branches: [kobayashi]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # phpunit.xml が参照する接続情報に合わせる（bloom_test / bloom / bloom_local_dev）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bloom_test
          MYSQL_USER: bloom
          MYSQL_PASSWORD: bloom_local_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, bcmath, ctype, tokenizer, xml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u bloom -pbloom_local_dev --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql..."; sleep 2
          done

      - name: Run tests
        run: php artisan test
